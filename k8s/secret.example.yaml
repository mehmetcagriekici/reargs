# Template only — do not put real values here or commit real values to git.
#
# Preferred: generate the Secret directly from your existing .env file so the
# values never get typed into a YAML file at all:
#
#   kubectl create secret generic reargs-secrets \
#     --from-env-file=.env \
#     --namespace=reargs
#
# Your .env must define: CHROMA_API_KEY, CHROMA_TENANT, CHROMA_DATABASE, GEMINI_API_KEY
# (same variables the app already reads via src/chroma_db/chroma_db.py and
# src/reargs_llm/reargs_llm.py).
#
# If you'd rather apply a manifest (e.g. from a CI pipeline that injects real
# values), copy this file to secret.yaml, fill it in, and keep secret.yaml out
# of git — it's already covered by the k8s/secret.yaml gitignore entry.
apiVersion: v1
kind: Secret
metadata:
  name: reargs-secrets
  namespace: reargs
type: Opaque
stringData:
  CHROMA_API_KEY: "changeme"
  CHROMA_TENANT: "changeme"
  CHROMA_DATABASE: "changeme"
  GEMINI_API_KEY: "changeme"
