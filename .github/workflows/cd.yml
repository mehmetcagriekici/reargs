name: Build and push Docker image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/reargs:latest

    - name: Render k8s manifests
      run: |
        sed -i "s#__DOCKERHUB_USERNAME__#${{ secrets.DOCKERHUB_USERNAME }}#" k8s/kustomization.yaml
        kubectl kustomize k8s > rendered-manifests.yaml

    - name: Upload rendered manifests
      uses: actions/upload-artifact@v4
      with:
        name: k8s-manifests
        path: rendered-manifests.yaml
